[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot — autonomous research agent: plans, gathers cited evidence, recovers from tool failures, writes structured reports"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.scripts]
research-agent = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: hits real external APIs; excluded from the default offline run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
